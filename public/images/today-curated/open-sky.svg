  <path d="M206 340 C 382 308, 534 310, 694 344" fill="none" stroke="#f0d58b" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round" />
  <path d="M748 316 C 878 292, 1002 294, 1140 322" fill="none" stroke="#9db5a8" stroke-opacity="0.1" stroke-width="3.5" stroke-linecap="round" />
