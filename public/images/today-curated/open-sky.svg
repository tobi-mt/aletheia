<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Open sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081210" />
      <stop offset="40%" stop-color="#12221e" />
      <stop offset="100%" stop-color="#0c1715" />
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="16%" r="22%">
      <stop offset="0%" stop-color="#fff1cc" stop-opacity="0.96" />
      <stop offset="38%" stop-color="#f0d58b" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#f0d58b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="foregroundMist" cx="22%" cy="76%" r="52%">
      <stop offset="0%" stop-color="#9ab7aa" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9ab7aa" stop-opacity="0" />
    </radialGradient>
    <filter id="blur28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="5" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#sky)" />
  <rect width="1280" height="800" fill="url(#sun)" />
  <rect width="1280" height="800" fill="url(#foregroundMist)" />
  <circle cx="990" cy="176" r="64" fill="#fff1cc" fill-opacity="0.88" />
  <circle cx="990" cy="176" r="112" fill="#fff1cc" fill-opacity="0.12" filter="url(#blur28)" />

  <g filter="url(#blur28)" opacity="0.78">
    <path d="M130 182 C 230 150, 360 154, 470 186 C 564 214, 626 226, 720 222" fill="none" stroke="#dfe8dd" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round" />
    <path d="M730 164 C 848 132, 964 136, 1100 170" fill="none" stroke="#dfe8dd" stroke-opacity="0.16" stroke-width="12" stroke-linecap="round" />
  </g>

