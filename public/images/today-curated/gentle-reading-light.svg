<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Gentle reading light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081210" />
      <stop offset="100%" stop-color="#172823" />
    </linearGradient>
    <radialGradient id="windowGlow" cx="74%" cy="24%" r="24%">
      <stop offset="0%" stop-color="#fff3d1" stop-opacity="0.96" />
      <stop offset="42%" stop-color="#f1d891" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#f1d891" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lampGlow" cx="56%" cy="76%" r="36%">
      <stop offset="0%" stop-color="#fff1ce" stop-opacity="0.94" />
      <stop offset="42%" stop-color="#f1d891" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f1d891" stop-opacity="0" />
    </radialGradient>
    <filter id="blur20" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="blur40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="2" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />
  <rect width="1280" height="800" fill="url(#windowGlow)" filter="url(#blur20)" />

