<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Calm water">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06100f" />
      <stop offset="48%" stop-color="#0f1f1c" />
      <stop offset="100%" stop-color="#081210" />
