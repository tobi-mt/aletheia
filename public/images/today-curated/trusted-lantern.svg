<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Trusted lantern">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06100f" />
      <stop offset="100%" stop-color="#182823" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="28%">
      <stop offset="0%" stop-color="#fff1ce" stop-opacity="0.98" />
      <stop offset="36%" stop-color="#f1d891" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#f1d891" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="windowGlow" cx="78%" cy="24%" r="22%">
      <stop offset="0%" stop-color="#fff3d1" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#fff3d1" stop-opacity="0" />
    </radialGradient>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="blur36" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="17" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05" />
      </feComponentTransfer>
    </filter>
  </defs>

