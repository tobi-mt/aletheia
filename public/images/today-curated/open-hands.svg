<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Open hands">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f" />
      <stop offset="48%" stop-color="#121d1a" />
      <stop offset="100%" stop-color="#1d1713" />
    </linearGradient>
    <radialGradient id="light" cx="64%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#fff4d9" stop-opacity="0.92" />
      <stop offset="42%" stop-color="#f2d991" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f2d991" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="58%" r="36%">
      <stop offset="0%" stop-color="#f4dfaa" stop-opacity="0.26" />
      <stop offset="64%" stop-color="#c39254" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c39254" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bread" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#ffe1ae" />
      <stop offset="100%" stop-color="#bf854a" />
    </radialGradient>
    <linearGradient id="skinL" x1="0" y1="0" x2="1" y2="1">
