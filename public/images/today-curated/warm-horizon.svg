<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Warm horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09110f" />
      <stop offset="35%" stop-color="#11211d" />
      <stop offset="65%" stop-color="#20362e" />
      <stop offset="100%" stop-color="#2a3f34" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="74%" cy="26%" r="24%">
      <stop offset="0%" stop-color="#fff0c9" stop-opacity="0.96" />
      <stop offset="34%" stop-color="#f0d58b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f0d58b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="foregroundGlow" cx="52%" cy="92%" r="42%">
      <stop offset="0%" stop-color="#e9d19a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e9d19a" stop-opacity="0" />
    </radialGradient>
    <filter id="blur60" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="10" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05" />
      </feComponentTransfer>
    </filter>
  </defs>

