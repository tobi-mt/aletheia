<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1514" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aletheia</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1514;
        --panel: rgba(18, 28, 25, 0.94);
        --border: rgba(208, 173, 85, 0.24);
        --text: #f8f5e8;
        --muted: #c7d4cd;
        --accent: #d0ad55;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 18%, rgba(208, 173, 85, 0.12), transparent 26%),
          radial-gradient(circle at 50% 82%, rgba(109, 143, 130, 0.12), transparent 24%),
          linear-gradient(180deg, #08110f 0%, #0b1513 54%, #0e1514 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 360px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        padding: 28px 24px 24px;
        text-align: center;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, rgba(208, 173, 85, 0.2), rgba(140, 181, 166, 0.18));
        color: var(--accent);
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .status {
        margin-top: 18px;
        min-height: 1.4em;
        color: #dce4de;
        font-weight: 600;
      }
      button {
        margin-top: 18px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: #f8f5e8;
        color: #111814;
        font-size: 0.98rem;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1 data-title>Aletheia is preparing</h1>
      <p data-body>We are warming up the app connection before handing you into the full experience.</p>
      <div class="status" data-status>Preparing the launch path…</div>
      <button type="button" data-retry>Retry</button>
    </main>
    <script>
      const titleEl = document.querySelector("[data-title]");
      const bodyEl = document.querySelector("[data-body]");
      const statusEl = document.querySelector("[data-status]");
      const retryButton = document.querySelector("[data-retry]");
      const fallbackLaunchUrl = "https://aletheia.mirrortalkpodcast.com";
      const configPaths = ["./capacitor.config.json", "../capacitor.config.json", "/capacitor.config.json"];
      let launchSequence = 0;
      const updateMode = new URLSearchParams(window.location.search).get("mode") === "update";
      const currentLaunchOrigin = window.location.origin;

      if (updateMode) {
        if (titleEl) {
          titleEl.textContent = "Aletheia is updating";
        }
        if (bodyEl) {
          bodyEl.textContent = "We are warming up the latest version before handing you back in.";
        }
        if (statusEl) {
          statusEl.textContent = "Preparing the latest version…";
        }
      }

      async function resolveLaunchUrl() {
        for (const path of configPaths) {
          try {
            const response = await fetch(path, { cache: "no-store" });
            if (!response.ok) {
              continue;
            }

            const config = await response.json();
            const appUrl = config?.launchUrl?.trim() || config?.bootstrapUrl?.trim() || config?.server?.url?.trim();
            if (appUrl) {
              return appUrl;
            }
          } catch {
            // Continue trying the other known config locations.
          }
        }

        return fallbackLaunchUrl;
      }

      async function probeLaunchUrl(url) {
        try {
          await fetch(url, {
            cache: "no-store",
            credentials: "omit",
            mode: "no-cors",
          });
          return true;
        } catch {
          return false;
        }
      }

      async function bootstrap() {
        const launchId = ++launchSequence;
        retryButton.disabled = true;
        statusEl.textContent = navigator.onLine ? "Preparing Aletheia…" : "Waiting for a connection…";

        if (!navigator.onLine) {
          statusEl.textContent = "Aletheia needs a connection before it can open.";
          retryButton.disabled = false;
          return;
        }

        const appUrl = await resolveLaunchUrl();
        const reachable = await probeLaunchUrl(appUrl);

        if (launchId !== launchSequence) {
          return;
        }

        if (reachable) {
          statusEl.textContent = "Opening Aletheia…";
          const nextUrl = new URL(appUrl);
          nextUrl.searchParams.set("launchOrigin", currentLaunchOrigin);
          if (updateMode) {
            nextUrl.searchParams.set("update", "1");
          }
          window.location.replace(nextUrl.href);
          return;
        }

        statusEl.textContent = "We could not reach Aletheia yet. Check the network and try again.";
        retryButton.disabled = false;
      }

      retryButton.addEventListener("click", bootstrap);
      window.addEventListener("online", bootstrap);
      window.addEventListener("focus", bootstrap);
      void bootstrap();
    </script>
  </body>
</html>
